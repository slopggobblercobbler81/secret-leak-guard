[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-leak-guard"
version = "1.0.0"
description = "High-performance CLI regex & entropy scanner for accidental tokens/secrets in git diffs and codebases."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "slopggobblercobbler81", email = "336610228+slopggobblercobbler81@users.noreply.github.com" }
]
keywords = [
    "security",
    "secret-scanner",
    "git-diff",
    "credentials",
    "entropy",
    "pre-commit",
    "sarif",
    "devsecops",
    "cli"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
secret-leak-guard = "secret_leak_guard.cli:main"

[project.urls]
Homepage = "https://github.com/slopggobblercobbler81/secret-leak-guard"
Repository = "https://github.com/slopggobblercobbler81/secret-leak-guard"
Issues = "https://github.com/slopggobblercobbler81/secret-leak-guard/issues"
